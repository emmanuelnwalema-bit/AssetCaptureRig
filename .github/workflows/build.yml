name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Inject API Key into Secrets.kt
        env:
          KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          mkdir -p app/src/main/java/com/example/assetcapturerig
          printf 'package com.example.assetcapturerig\n\nobject Secrets {\n    const val DASHSCOPE_API_KEY: String = "%s"\n}\n' "$KEY" > app/src/main/java/com/example/assetcapturerig/Secrets.kt

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetCaptureRig-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
